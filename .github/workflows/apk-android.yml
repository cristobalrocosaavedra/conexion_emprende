name: Validación y APK Android de pruebas
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, "feat/**", "fix/**", "docs/**"]
  workflow_dispatch:
env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NEXT_TELEMETRY_DISABLED: "1"
permissions:
  contents: read
concurrency:
  group: apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Preparar herramientas del checklist
        run: |
          python3 -m venv "$RUNNER_TEMP/tv-catalogo-venv"
          "$RUNNER_TEMP/tv-catalogo-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/catalogo/requirements.txt
          echo "$RUNNER_TEMP/tv-catalogo-venv/bin" >> "$GITHUB_PATH"
      - run: pnpm validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pantallas-${{ github.run_number }}
          path: previews/
          if-no-files-found: error
          retention-days: 14
  motor-rutas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/test-routing.sh
  ruteo-publico:
    name: Probar rutas regional, interregional e insular
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node --experimental-transform-types scripts/test-public-routing.mjs
  compilar:
    permissions:
      contents: read
      actions: read
    needs: [validar, motor-rutas, ruteo-publico]
    if: ${{ !startsWith(github.ref, 'refs/heads/docs/') && !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: pnpm install --frozen-lockfile
      - name: Asignar número incremental de Android
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./apps/mobile/app-identity.json').ciVersionCodeOffset")
          echo "TV_ANDROID_VERSION_CODE=$((base + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Generar proyecto Android desde Expo
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Verificar distribución Gradle
        shell: bash
        run: |
          set -euo pipefail
          propiedades=apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$propiedades" | tr -d '\\')
          case "$url" in https://services.gradle.org/distributions/*-bin.zip) ;; *) exit 1 ;; esac
          suma=$(curl --location --proto '=https' --proto-redir '=https' --fail --silent --show-error --retry 3 "$url.sha256")
          if [[ ! "$suma" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'La respuesta de Gradle no contiene un checksum SHA-256 válido.' >&2
            exit 1
          fi
          existente=$(sed -n 's/^distributionSha256Sum=//p' "$propiedades")
          if [ -n "$existente" ] && [ "$existente" != "$suma" ]; then
            echo 'El checksum guardado difiere del oficial; se detiene la compilación.' >&2
            exit 1
          fi
          if [ -z "$existente" ]; then
            echo "distributionSha256Sum=$suma" >> "$propiedades"
          fi
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Compilar APK con JavaScript incluido y firma de pruebas
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2
      - name: Verificar firma y preparar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          archivo=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$archivo"
          verificador=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$verificador"
          "$verificador" verify --print-certs "$archivo" > "$RUNNER_TEMP/certificado.txt"
          cat "$RUNNER_TEMP/certificado.txt"
          badging="$(dirname "$verificador")/aapt2"
          "$badging" dump badging "$archivo" > "$RUNNER_TEMP/manifiesto.txt"
          unzip -p "$archivo" assets/index.android.bundle > "$RUNNER_TEMP/territorio-vivo.bundle"
          test -s "$RUNNER_TEMP/territorio-vivo.bundle"
          mkdir -p artefactos
          cp "$archivo" artefactos/territorio-vivo-android.apk
          node scripts/check-apk.mjs "$RUNNER_TEMP/certificado.txt" "$RUNNER_TEMP/manifiesto.txt" artefactos/territorio-vivo-android.apk artefactos/version.json
          node scripts/check-upgrade.mjs "$verificador" "$badging" artefactos/version.json
          git rev-parse HEAD > artefactos/COMMIT.txt
          (cd artefactos && sha256sum *.apk > SHA256SUMS.txt)
          echo 'APK de maqueta Android ARM64. Catálogo de referencia pendiente de verificación; mapa de fondo requiere Internet.' > artefactos/LEEME.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: territorio-vivo-android-${{ github.run_number }}
          path: artefactos/territorio-vivo-android.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Guardar verificación por separado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verificacion-android-${{ github.run_number }}
          path: |
            artefactos/version.json
            artefactos/SHA256SUMS.txt
            artefactos/COMMIT.txt
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Actualizar última versión compartida
    needs: compilar
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: canal-android-compartido
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: territorio-vivo-android-${{ github.run_number }}
          path: artefactos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verificacion-android-${{ github.run_number }}
          path: artefactos
      - name: Publicar de forma atómica y conservar versiones anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android.mjs
