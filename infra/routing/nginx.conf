worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    error_log /dev/null;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=routes:1m rate=1r/s;
    server {
        listen 8080;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Cache-Control" always;
        if ($request_method !~ ^(GET|OPTIONS)$) { return 405; }
        if ($request_method = OPTIONS) { return 204; }
        location = /capabilities {
            default_type application/json;
            return 200 '{"service":"territorio-vivo-routing","schema":1,"coordinateLogs":false,"profile":"driving","maxWaypoints":40,"coverage":"Chile; depende del extracto instalado"}';
        }
        location = /healthz {
            proxy_pass http://osrm:5000/nearest/v1/driving/-70.3129,-18.4783?number=1;
        }
        location ~ "^/route/v1/driving/[-0-9.,;]+$" {
            limit_req zone=routes burst=8 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 25s;
            proxy_connect_timeout 3s;
            proxy_pass http://osrm:5000;
        }
        location / { return 404; }
    }
}
